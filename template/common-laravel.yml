services:

  nginx-fpm-laravel: #inner port :80
    build:
      context: .
      dockerfile: laravel.Dockerfile
      args:
        - APP_ENV=${APP_ENV}
        - LARAVEL_ROOT=${LARAVEL_ROOT}
        - PHP_VERSION=${PHP_VERSION:-8.3}
        - OWNER_USER_ID=${OWNER_USER_ID}
        - OWNER_GROUP_ID=${OWNER_GROUP_ID}
        # Optional private-package auth; all empty for public apps.
        - COMPOSER_GITLAB_HOST=${COMPOSER_GITLAB_HOST:-}
        - COMPOSER_GITLAB_SSH_PORT=${COMPOSER_GITLAB_SSH_PORT:-}
        - COMPOSER_GITLAB_TOKEN_USER=${COMPOSER_GITLAB_TOKEN_USER:-}
        - COMPOSER_GITLAB_TOKEN=${COMPOSER_GITLAB_TOKEN:-}
    environment:
      - APP_ENV=${APP_ENV}
    restart: unless-stopped
    user: www-data
    working_dir: /var/www
    entrypoint: ./entrypoint.sh
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:80 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Image mode's shared half: everything the build-mode service has except `build:`, since the
  # artifact arrives from the registry. Extended by compose-laravel-image.yml.
  nginx-fpm-laravel-runtime: #inner port :80
    environment:
      - APP_ENV=${APP_ENV}
    restart: unless-stopped
    user: www-data
    working_dir: /var/www
    entrypoint: /usr/local/bin/entrypoint.sh
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:80 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
