# Image mode: run a prebuilt image from the registry.
#
# `image:` in place of `build:` means the artifact CI tested is the one that runs, and this host
# needs only a registry pull — no source checkout, build toolchain or private-package credentials.
# Bind-mounting the environment file keeps APP_KEY and the database password out of a published
# image.
#
# Covers the deployed environments only: dev mounts live source to edit, and test builds the tree
# it is about to test, so both want a build rather than a fixed artifact.

services:

  nginx-fpm-laravel-staging:
    container_name: ${APP_NAME}_staging
    image: ${APP_IMAGE}
    extends:
      file: common-laravel.yml
      service: nginx-fpm-laravel-runtime
    volumes:
      - ./env/generated/${APP_ENV}.env:/var/www/.env:ro
      - ./storage-${APP_ENV}/volume:/var/www/storage/volume
      - ./storage-${APP_ENV}/logs:/var/www/storage/logs
    profiles:
      - staging

  nginx-fpm-laravel-production:
    container_name: ${APP_NAME}_production
    image: ${APP_IMAGE}
    extends:
      file: common-laravel.yml
      service: nginx-fpm-laravel-runtime
    volumes:
      - ./env/generated/${APP_ENV}.env:/var/www/.env:ro
      - ./storage-${APP_ENV}/volume:/var/www/storage/volume
      - ./storage-${APP_ENV}/logs:/var/www/storage/logs
    profiles:
      - production


networks:
  default:
    external: true
    name: ${SHARED_NETWORK_NAME}
