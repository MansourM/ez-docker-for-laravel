# Builds the ez-laravel base image pair and pushes it to registry.fardadev.com.
#
# Before this pipeline existed the pair was published by hand from a developer's Docker daemon via
# scripts/publish-base-images.sh. That is the same arrangement fardadev/ci-images was deliberately
# migrated out of on 2026-08-25, for reasons its README spells out: a hand-built image has no
# host-independent definition, no version identity, and nothing asserts it before it reaches
# consumers. The script stays as a local escape hatch; CI is the publishing path.
#
# WHY BUILDAH AND NOT DOCKER-IN-DOCKER: dind needs privileged = true, which gives every job on that
# runner root-equivalence on fardadev — the same host that runs GitLab, Caddy and the live sites.
# See fardadev-infra: configs/gitlab-runner/runner-template-buildah.toml. The `buildah` tag routes
# to the runner entry carrying security_opt = ["seccomp:unconfined", "apparmor:unconfined"]; both
# are required — with default profiles the build dies on unshare(CLONE_NEWUSER), and with only
# seccomp unconfined it dies on an AppArmor remount denial.

stages:
  - build

variables:
  # vfs, not overlay: buildah cannot stack overlayfs on the overlayfs the job container already
  # runs on. This is the storage driver, and it is why a buildah build is ~2x slower than docker's.
  STORAGE_DRIVER: vfs
  # Emit a Docker v2 manifest rather than OCI, so `docker pull` of these images behaves identically
  # to the hand-built ones every existing consumer already pulls.
  BUILDAH_FORMAT: docker
  # chroot isolation instead of the default runc: avoids nested namespace creation inside an
  # already-unprivileged container.
  BUILDAH_ISOLATION: chroot

.base-build:
  stage: build
  tags:
    - buildah
  image: quay.io/buildah/stable
  # ONE MATRIX JOB AT A TIME. The first publish run put all three PHP versions on the runner
  # concurrently and filled the disk: with STORAGE_DRIVER=vfs every layer is copied in full, and
  # each job builds TWO images (the runtime half carries nginx, supervisor, mysql-client and the gd
  # image libs). The registry stores its blobs on that same disk, so it started returning
  # 500 Internal Server Error with "no space left on device" mid-push, and 8.3 and 8.4 failed
  # while 8.5 happened to get through. Serialising costs wall-clock on a pipeline that runs when a
  # PHP version moves; it does not cost a red pipeline and a half-published tag set.
  resource_group: base-images
  parallel:
    matrix:
      # 8.3 is what production runs today. 8.5 is the target of account-manager's framework
      # upgrade (docs/specs/002-framework-upgrade). 8.4 is built because CI images already offer
      # it and an app may land there; drop a version here when nothing consumes it.
      - PHP_VERSION: ["8.3", "8.4", "8.5"]
  script:
    - BUILD_IMAGE="$CI_REGISTRY_IMAGE/ez-laravel-build"
    - RUNTIME_IMAGE="$CI_REGISTRY_IMAGE/ez-laravel-runtime"
    # --password-stdin, never on argv (fardadev-infra rules.md §2).
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # One half at a time: build, assert, push, then DROP IT from local storage before starting the
    # next. Holding both halves plus their vfs layer copies is what exhausted the disk. Assert
    # always runs before push — a broken image that never reaches the registry cannot break anyone
    # else's build — and the two halves carry deliberately different extension sets.
    - |
      set -eu
      for half in build runtime; do
        case "$half" in
          build)   image="$BUILD_IMAGE";   dockerfile=template/base-build.Dockerfile ;;
          runtime) image="$RUNTIME_IMAGE"; dockerfile=template/base-runtime.Dockerfile ;;
        esac

        echo "==> building $half half of $PHP_VERSION"
        buildah build \
          --build-arg "PHP_VERSION=$PHP_VERSION" \
          --tag "$image:$PHP_VERSION" \
          --tag "$image:$PHP_VERSION-$CI_COMMIT_SHORT_SHA" \
          -f "$dockerfile" \
          template

        ci/assert-base-images.sh buildah "$half" "$image:$PHP_VERSION" "$PHP_VERSION"

        if [ "$PUBLISH" = "true" ]; then
          echo "==> publishing $image ($PHP_VERSION + $CI_COMMIT_SHORT_SHA)"
          buildah push "$image:$PHP_VERSION"
          buildah push "$image:$PHP_VERSION-$CI_COMMIT_SHORT_SHA"
        else
          echo "verify-only pipeline (PUBLISH=$PUBLISH) — $half half built and asserted, not pushed"
        fi

        # Reclaim before the next half. Failure here is not fatal: the job is about to end anyway
        # and a stale local image cannot corrupt what has already been pushed.
        buildah rmi "$image:$PHP_VERSION" "$image:$PHP_VERSION-$CI_COMMIT_SHORT_SHA" || true
      done

# Merge requests: prove both images still build and pass their assertions, publish nothing. The
# floating :8.3 tag must never move because of an unmerged branch — every app builds FROM it.
verify:
  extends: .base-build
  variables:
    PUBLISH: "false"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Default branch: build, assert, publish.
#
# TWO TAGS ON PURPOSE. :8.5 is the floating tag apps pin in their Dockerfile ARG, so it must keep
# moving. :8.5-<sha> is immutable and is what makes a build reproducible — given a red app
# pipeline you can rebuild against the exact base that produced it.
publish:
  extends: .base-build
  variables:
    PUBLISH: "true"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Manual/scheduled rebuilds also publish — that is the point of them: picking up upstream
    # php/node/composer security fixes without a code change.
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"
